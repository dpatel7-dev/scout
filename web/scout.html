<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>scout</title>
<link rel="icon" id="icon" href="data:,">
<meta name="theme-color" content="#161618">
<style>
/* scout: a quiet clearing in a pixel forest. At night (dark) there are stars,
   the moon and fireflies; by day (light) the sun, clouds and butterflies, and
   now and then a bird flies off. Pip in the middle, one box to type or paste
   into. The forest dims once you're chatting so the words come first. */
:root {
  --bg: #161618; --panel: #222226; --panel-2: #2b2b30; --line: #36363c; --ink: #ececee; --dim: #a3a2a9; --faint: #6e6d74;
  --accent: #ef6a1f; --accent-soft: rgba(239, 106, 31, .16); --amber: #f2a93b; --link: #8ab8ff; --ok: #6fd39a; --bad: #ff7a8a;
  --code-bg: #1b1b1f; --tok-k: #ff9e64; --tok-s: #9ece6a; --tok-n: #e0af68; --tok-c: #6c6b75; --tok-key: #7dcfff;
  --shadow: 0 18px 50px -24px rgba(0, 0, 0, .7);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
:root[data-theme=light] {
  --bg: #fafaf9; --panel: #ffffff; --panel-2: #f3f2f0; --line: #e4e1dc; --ink: #1d1c1a; --dim: #66625c; --faint: #a39e97;
  --accent: #e05a12; --accent-soft: rgba(224, 90, 18, .12); --amber: #b7700d; --link: #1f5fbf; --ok: #1d8a52; --bad: #c8304a;
  --code-bg: #f6f5f3; --tok-k: #c2410c; --tok-s: #3f7d1d; --tok-n: #9a5b00; --tok-c: #a39e97; --tok-key: #1f5fbf;
  --shadow: 0 18px 50px -26px rgba(60, 40, 20, .35);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--link); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
canvas.pip { image-rendering: pixelated; }

/* the forest */
#glow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; image-rendering: pixelated; transition: opacity .7s ease; }
body.chatting #glow { opacity: .3; }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 6px; padding: 10px 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
body.chatting .top { background: linear-gradient(var(--bg) 62%, color-mix(in srgb, var(--bg) 0%, transparent)); }
.icon { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 10px; background: none; color: var(--dim); }
.icon:hover { background: var(--panel-2); color: var(--ink); }
.spacer { flex: 1; }
.pill { position: absolute; left: 50%; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 80%, transparent); backdrop-filter: blur(10px); border-radius: 999px; padding: 5px 14px 5px 12px; font-size: .82rem; color: var(--dim); white-space: nowrap; max-width: calc(100vw - 190px); overflow: hidden; text-overflow: ellipsis; }
.pill b { color: var(--accent); font-weight: 650; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.pill:hover { color: var(--ink); border-color: var(--faint); }

/* the stage: centred on the home screen, a column of messages once chatting */
.stage { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
.hello { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 16px 26px; text-align: center; }
.hello canvas { width: 64px; height: 60px; margin-bottom: 14px; }
.hello p { margin: 0; color: var(--dim); font-size: .98rem; }
.thread { display: none; flex: 1; overflow-y: auto; padding: 64px 16px 12px; scroll-behavior: smooth; }
.thread .col { width: min(760px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }
.dock { padding: 0 16px 22px; }
.home-gap { flex: 1; }
body.chatting .hello, body.chatting .home-gap { display: none; }
body.chatting .thread { display: block; }
body.chatting .dock { padding-bottom: 14px; }

/* the box you type in */
.composer { width: min(720px, 100%); margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 12px 12px 10px 14px; box-shadow: var(--shadow); transition: border-color .15s; }
.composer:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.composer.drop { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
.composer textarea { display: block; width: 100%; border: 0; outline: none; resize: none; background: none; font-size: 1.02rem; line-height: 1.5; padding: 4px 2px 8px; max-height: 220px; min-height: 30px; }
.composer textarea::placeholder { color: var(--faint); }
.atts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.att { display: flex; align-items: center; gap: 10px; max-width: 100%; border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 7px 8px 7px 10px; font-size: .85rem; }
.att .k { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; font: 700 .62rem var(--mono); flex: none; }
.att b { display: block; font-weight: 600; }
.att small { display: block; color: var(--dim); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: .75rem; }
.att button { border: 0; background: none; color: var(--faint); width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; }
.att button:hover { color: var(--ink); background: var(--line); }
.row { display: flex; align-items: center; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: none; border-radius: 10px; padding: 6px 10px; font-size: .86rem; color: var(--dim); white-space: nowrap; }
.chip:hover { color: var(--ink); background: var(--panel-2); }
.chip[aria-pressed=true] { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.chip.sq { width: 34px; height: 34px; padding: 0; justify-content: center; border: 1px solid var(--line); }
.chip.model { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
.chip.model svg { width: 14px; height: 14px; }
.send { width: 36px; height: 36px; border-radius: 11px; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .25; cursor: default; }
.send:not(:disabled):hover { background: var(--accent); color: #fff; }
.send.stop { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); }
.fine { text-align: center; color: var(--faint); font-size: .76rem; margin-top: 8px; }
.tries { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: min(720px, 100%); margin: 14px auto 0; }
.tries button { border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 70%, transparent); backdrop-filter: blur(6px); border-radius: 999px; padding: 6px 13px; color: var(--dim); font-size: .86rem; }
.tries button:hover { color: var(--ink); border-color: var(--faint); }
body.chatting .tries { display: none; }

/* messages */
.me { align-self: flex-end; max-width: 85%; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.me .bubble { background: var(--panel-2); border: 1px solid var(--line); border-radius: 18px 18px 6px 18px; padding: 10px 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.paste { width: min(640px, 85vw); border: 1px solid var(--line); border-radius: 14px; background: var(--panel); overflow: hidden; }
.paste header { display: flex; align-items: center; gap: 8px; padding: 7px 10px 7px 12px; border-bottom: 1px solid var(--line); font-size: .8rem; color: var(--dim); }
.paste header b { color: var(--ink); font-weight: 600; }
.paste header .sp { flex: 1; }
.paste header button { border: 0; background: none; color: var(--dim); font-size: .78rem; padding: 2px 8px; border-radius: 6px; }
.paste header button:hover { color: var(--ink); background: var(--panel-2); }
.paste .view { max-height: 240px; overflow: hidden; position: relative; }
.paste.open .view { max-height: none; }
.paste:not(.open) .view.long::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: linear-gradient(transparent, var(--panel)); pointer-events: none; }
.paste pre { margin: 0; padding: 12px 14px; font: .82rem/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--code-bg); }
.paste .txt { padding: 12px 14px; font-size: .92rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.paste table, .md table { border-collapse: collapse; width: 100%; font-size: .88rem; }
.paste th, .paste td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.paste th { color: var(--dim); font-weight: 600; background: var(--panel-2); position: sticky; top: 0; }
.paste .tbl { overflow-x: auto; }
.pip-msg { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; }
.pip-msg > canvas { width: 28px; height: 26px; margin-top: 3px; }
.status { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: .9rem; min-height: 28px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; background: var(--accent); animation: blink 1.1s infinite; }
.dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.srcs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; scrollbar-width: thin; }
.src { flex: none; display: inline-flex; align-items: center; gap: 7px; max-width: 230px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 5px 10px 5px 6px; text-decoration: none; color: var(--ink); font-size: .8rem; }
.src:hover { border-color: var(--faint); }
.src span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src small { color: var(--faint); }
.fav { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; color: #fff; font: 700 .64rem var(--sans); flex: none; }
.md { overflow-wrap: anywhere; line-height: 1.68; }
.md > :first-child { margin-top: 0; }
.md p { margin: 0 0 .85em; }
.md h2, .md h3 { font-size: 1.08rem; line-height: 1.35; margin: 1.3em 0 .45em; }
.md ul, .md ol { margin: 0 0 1em; padding-left: 1.35em; }
.md li { margin: .28em 0; }
.md li::marker { color: var(--accent); }
.md blockquote { margin: 0 0 1em; padding: 2px 14px; border-left: 3px solid var(--line); color: var(--dim); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
.md code { font: .88em var(--mono); background: var(--panel-2); border: 1px solid var(--line); padding: .05em .35em; border-radius: 5px; }
.md th, .md td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.md th { color: var(--dim); font-weight: 650; font-size: .85rem; }
.md .tbl { overflow-x: auto; margin: .3em 0 1.1em; border: 1px solid var(--line); border-radius: 12px; }
.md .tbl table { margin: 0; }
.md .tbl tr:last-child td { border-bottom: 0; }
.codeblock { margin: 0 0 1em; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--code-bg); }
.codeblock header { display: flex; align-items: center; padding: 5px 6px 5px 12px; font: .75rem var(--mono); color: var(--faint); border-bottom: 1px solid var(--line); }
.codeblock header span { flex: 1; }
.codeblock header button { border: 0; background: none; color: var(--dim); font: .78rem var(--sans); padding: 3px 9px; border-radius: 6px; }
.codeblock header button:hover { background: var(--panel-2); color: var(--ink); }
.codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: .85rem/1.55 var(--mono); }
.md .codeblock code { background: none; border: 0; padding: 0; font-size: inherit; }
.t-k { color: var(--tok-k); } .t-s { color: var(--tok-s); } .t-n { color: var(--tok-n); } .t-c { color: var(--tok-c); font-style: italic; } .t-key { color: var(--tok-key); }
.cite { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; margin: 0 1px; border-radius: 6px; font: 650 .7rem var(--sans); color: #fff; text-decoration: none; vertical-align: 2px; }
.cite:hover { filter: brightness(1.12); }
.caret::after { content: ""; display: inline-block; width: 8px; height: 1.05em; vertical-align: -2px; background: var(--accent); margin-left: 2px; animation: blink 1s infinite; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-top: 4px; }
.acts button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--faint); font-size: .8rem; padding: 4px 8px; border-radius: 8px; }
.acts button:hover { color: var(--ink); background: var(--panel-2); }
.acts .by { color: var(--faint); font-size: .76rem; margin-left: auto; }
.more { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin-top: 12px; }
.more button { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 7px 12px; text-align: left; color: var(--ink); font-size: .9rem; }
.more button:hover { border-color: var(--accent); }
.more button svg { color: var(--accent); width: 15px; height: 15px; }
.oops { border: 1px solid color-mix(in srgb, var(--bad) 45%, var(--line)); background: color-mix(in srgb, var(--bad) 8%, var(--panel)); border-radius: 14px; padding: 11px 15px; }

/* setting up free AI */
.setup { border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; background: var(--panel); }
.setup h2 { margin: 0 0 4px; font-size: 1.1rem; }
.setup p { margin: 0 0 12px; color: var(--dim); font-size: .95rem; }
.pick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.pick button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 6px 13px; font-weight: 600; color: var(--dim); font-size: .9rem; }
.pick button[aria-pressed=true] { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 0 3px var(--accent-soft); }
.steps { margin: 0 0 12px; padding-left: 1.3em; color: var(--dim); font-size: .95rem; }
.steps li { margin: 4px 0; }
.keyrow { display: flex; gap: 8px; }
.keyrow input { flex: 1; min-width: 0; padding: 9px 13px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); font-family: var(--mono); font-size: .88rem; }
.keyrow input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 11px; padding: 9px 16px; font-weight: 650; background: var(--ink); color: var(--bg); white-space: nowrap; }
.btn:hover { background: var(--accent); color: #fff; }
.btn.light { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); }
.msg { min-height: 1.3em; margin-top: 8px; font-size: .88rem; color: var(--dim); }
.msg.err { color: var(--bad); } .msg.ok { color: var(--ok); }

/* the list of chats */
.drawer { position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); background: var(--panel); border-right: 1px solid var(--line); box-shadow: var(--shadow); transform: translateX(-102%); transition: transform .22s ease; display: flex; flex-direction: column; padding: 12px 10px; }
.drawer.open { transform: none; }
.scrim { position: fixed; inset: 0; z-index: 25; background: rgba(0, 0, 0, .3); }
.drawer .head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 12px; font-weight: 700; }
.drawer .head canvas { width: 22px; height: 21px; }
.drawer .newc { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 11px; padding: 9px 12px; font-weight: 600; margin-bottom: 10px; }
.drawer .newc:hover { border-color: var(--accent); }
.drawer .list { flex: 1; overflow-y: auto; }
.drawer h4 { margin: 12px 8px 4px; font-size: .74rem; color: var(--faint); font-weight: 600; }
.drawer .c { display: flex; align-items: center; border-radius: 9px; }
.drawer .c:hover, .drawer .c.on { background: var(--panel-2); }
.drawer .c button.t { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 8px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; color: var(--ink); }
.drawer .c button.x { border: 0; background: none; color: var(--faint); width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; opacity: 0; }
.drawer .c:hover button.x, .drawer .c button.x:focus-visible { opacity: 1; }
.drawer .c button.x:hover { color: var(--bad); }
.drawer .none { color: var(--faint); font-size: .88rem; padding: 8px 10px; }
.drawer .foot { border-top: 1px solid var(--line); padding-top: 8px; display: flex; gap: 4px; }
.drawer .foot button { flex: 1; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 8px 10px; border-radius: 9px; color: var(--dim); font-size: .88rem; }
.drawer .foot button:hover { background: var(--panel-2); color: var(--ink); }

/* pop-up menu for picking the AI */
.pop { position: fixed; z-index: 40; width: 300px; max-height: 60vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; }
.pop button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 9px; font-size: .9rem; }
.pop button:hover { background: var(--panel-2); }
.pop button small { color: var(--faint); margin-left: auto; font-size: .75rem; }
.pop button .tick { width: 16px; color: var(--accent); }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

dialog { border: 0; padding: 0; background: none; color: inherit; max-width: calc(100vw - 24px); }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
.sheet { width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px 24px; }
.sheet h2 { margin: 0 0 4px; font-size: 1.2rem; }
.sheet section { padding: 14px 0; border-top: 1px solid var(--line); }
.sheet section:first-of-type { border-top: 0; }
.sheet h3 { margin: 0 0 6px; font-size: 1rem; }
.sheet p { margin: 0 0 10px; color: var(--dim); font-size: .92rem; }
.sheet .setup { border: 0; padding: 0; background: none; }
.sheet .end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

@media (max-width: 560px) {
  .chip .lbl, .pill .wide { display: none; }
  .chip.model { display: none; }
  .me { max-width: 92%; }
  .pip-msg { grid-template-columns: 1fr; }
  .pip-msg > canvas { display: none; }
  .keyrow { flex-direction: column; }
  .dock { padding: 0 8px 10px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .thread { scroll-behavior: auto; } }
</style>
</head>
<body>
<canvas id="glow" aria-hidden="true"></canvas>

<header class="top">
  <button class="icon" id="sideBtn" title="Your chats" aria-label="Your chats"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg></button>
  <button class="icon" id="newTop" title="New chat" aria-label="New chat" hidden><svg class="i" viewBox="0 0 24 24"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
  <button class="pill" id="pill" type="button"><i></i><span id="pillText">Getting ready…</span></button>
  <span class="spacer"></span>
  <button class="icon" id="themeBtn" title="Light or dark" aria-label="Light or dark"></button>

<script src="forest.js"></script>
<script>
(function () {
  'use strict';

  }
  function icon(path) { return '<svg class="i" viewBox="0 0 24 24">' + path + '</svg>'; }
  var I = {
    copy: '<rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/>',

    x: '<path d="M6 6l12 12M18 6 6 18"/>',

    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
    moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
    tick: '<path d="m5 12 5 5 9-10"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
  };

  // ── Pip the owl, in pixels ──
  var PIP = ['..D..........D..', '..DD........DD..', '..DBBBBBBBBBBD..', '.DBWWWWBBWWWWBD.', '.DWYYYWBBWYYYWD.', '.DWYKYWBBWYKYWD.', '.DWYYYWOOWYYYWD.', '.DBWWWBOOBWWWBD.', '.DBBCCCCCCCCBBD.', 'DBBCBCCBCCBCCBBD', 'DBBCCCCCCCCCCBBD', 'DBBCCBCCBCCBCBBD', '.DBBCCCCCCCCBBD.', '..DBBBBBBBBBBD..', '...FF......FF...'];
  var BLINK = PIP.map(function (r, y) { return y === 5 ? r.replace(/YKY/g, 'BBB') : y === 4 || y === 6 ? r.replace(/YYY/g, 'BBB') : r; });

  addEventListener('lookchange', function () { theme = 'auto'; try { localStorage.setItem('scout-look', window.__LOOK__); localStorage.removeItem('scout-theme'); } catch (e) { /* fine */ } paintTheme(); });
  function isDark() { return theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches); }

  }
  // the forest: night in dark mode, day in light mode
  var forest = null;
  function drawGlow() {

  }
  paintTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme);
  $('themeBtn').onclick = function () { theme = isDark() ? 'light' : 'dark'; try { localStorage.setItem('scout-theme', theme); } catch (e) { /* fine */ } paintTheme(); };

  // ── what got pasted: code, JSON, a table, or writing ──
  var LANG_EXT = { js: 'javascript', mjs: 'javascript', cjs: 'javascript', jsx: 'javascript', ts: 'typescript', tsx: 'typescript', py: 'python', html: 'html', htm: 'html', css: 'css', scss: 'css', sh: 'shell', zsh: 'shell', bash: 'shell', sql: 'sql', xml: 'xml', yaml: 'yaml', yml: 'yaml', toml: 'toml', ini: 'ini', java: 'java', c: 'c', h: 'c', cpp: 'cpp', hpp: 'cpp', cs: 'csharp', go: 'go', rs: 'rust', rb: 'ruby', php: 'php', swift: 'swift', kt: 'kotlin', lua: 'lua', r: 'r', vue: 'html', svelte: 'html' };
  var LANG_HINTS = [
    ['python', /^\s*(def |class \w+.*:|import \w|from \S+ import|elif |print\()|:\s*$\n\s{2,}\S/m],
    ['javascript', /\b(const|let|function|=>|console\.log|require\(|document\.|async |await )\b|=>/],
    ['typescript', /:\s*(string|number|boolean)\b|interface \w+ \{/],
    ['html', /<\/?(html|head|body|div|span|p|a|ul|li|script|style|section|button)\b/i],
    ['css', /^[.#]?[\w-]+(\s*[,>+~]?\s*[.#]?[\w-]+)*\s*\{[^}]*:[^}]*;/m],
    ['sql', /\b(SELECT|INSERT INTO|UPDATE|CREATE TABLE|DELETE FROM)\b[\s\S]*\b(FROM|VALUES|SET|WHERE)\b/i],
    ['shell', /^\s*(\$ |#!\/bin\/|sudo |brew |npm |cd |ls |mkdir |echo |curl |git )/m],
    ['java', /\b(public|private) (static )?(void|class|int|String)\b/],
    ['c', /#include\s*<|\bint main\s*\(/],
    ['go', /^package \w+|\bfunc \w+\(/m],
    ['rust', /\bfn \w+\(|\blet mut\b|println!/],
    ['yaml', /^[\w-]+:\s*\S.*\n[\w-]+:/m],
  ];
  function splitRow(line, delim) {
    var out = [], cur = '', q = false;
    for (var i = 0; i < line.length; i++) {

    }
    out.push(cur.trim());
    return out;
  }
  function asTable(text, delim) {
    var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
    return lines.map(function (l) { return splitRow(l, delim); });
  }
  function looksTable(text) {
    var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (lines.length < 2) return null;
    var tries = [['\t', 2], [',', 3], [';', 3], ['|', 3]];
    for (var k = 0; k < tries.length; k++) {
      var d = tries[k][0];
      if (lines.length < tries[k][1]) continue;
      var rows = lines.map(function (l) { return splitRow(d === '|' ? l.replace(/^\s*\||\|\s*$/g, '') : l, d); });
      var w = rows[0].length;
      if (w < 2) continue;
      var same = rows.filter(function (r) { return r.length === w; }).length;
      var cells = [].concat.apply([], rows);
      var avg = cells.reduce(function (a, c) { return a + c.length; }, 0) / cells.length;
      if (same / rows.length >= 0.85 && avg < 40) return d;
    }
    return null;
  }
  function kindOf(text, name) {
    var t = text.trim();
    var ext = name && name.indexOf('.') > 0 ? name.split('.').pop().toLowerCase() : '';
    if (ext === 'json' || /^[\[{]/.test(t)) { try { JSON.parse(t); return { kind: 'json', lang: 'json' }; } catch (e) { /* not JSON */ } }
    if (ext === 'csv' || ext === 'tsv') return { kind: 'table', delim: ext === 'tsv' ? '\t' : ',' };
    if (LANG_EXT[ext]) return { kind: 'code', lang: LANG_EXT[ext] };
    if (ext === 'md' || ext === 'markdown') return { kind: 'markdown' };
    var d = looksTable(t);
    if (d && !/[.!?]\s+[A-Z]/.test(t.slice(0, 400))) return { kind: 'table', delim: d };
    var best = null, score = 0;
    LANG_HINTS.forEach(function (h) { var m = t.match(new RegExp(h[1].source, h[1].flags.replace('g', '') + 'g')); var s = m ? m.length : 0; if (s > score) { score = s; best = h[0]; } });

  }
  var KIND_LOOK = { code: ['</>', '#3a7bd5'], json: ['{ }', '#7b4fd6'], table: ['▦', '#1f9d7a'], markdown: ['¶', '#c2571a'], text: ['Aa', '#6b6f78'] };

    if (p.kind === 'json') return 'JSON · ' + lines + ' lines';
    if (p.kind === 'code') return (p.lang ? p.lang.charAt(0).toUpperCase() + p.lang.slice(1) + ' code' : 'Code') + ' · ' + lines + ' lines';

  }

  // ── colouring code ──
  var KW = 'if else elif for while do return break continue switch case default try catch except finally throw raise new delete class def function func fn let const var mut import from export as with in of is not and or async await yield lambda pass public private protected static void int float double char bool boolean string true false True False null None nil undefined this self super struct enum interface type package use go select insert into update set where values create table order by group having join on limit print echo then fi done esac local'.split(' ');
  var KWS = {}; KW.forEach(function (k) { KWS[k] = 1; KWS[k.toUpperCase()] = 1; });
  function highlight(code, lang) {
    var hash = /^(python|shell|ruby|yaml|toml|ini|r)$/.test(lang || '');
    var dash = lang === 'sql';
    var parts = ['(\\/\\*[\\s\\S]*?\\*\\/|<!--[\\s\\S]*?-->' + (hash ? '|#[^\\n]*' : '|\\/\\/[^\\n]*') + (dash ? '|--[^\\n]*' : '') + ')', '("(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\'|`(?:\\\\.|[^`\\\\])*`)', '(\\b\\d+(?:\\.\\d+)?\\b)', '(\\b[A-Za-z_]\\w*\\b)'];

      else if (m[2]) out += '<span class="t-s">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="t-n">' + m[3] + '</span>';

      if (s) return colon ? '<span class="t-key">' + s + '</span>' + colon : '<span class="t-s">' + s + '</span>';
      if (lit) return '<span class="t-k">' + lit + '</span>';
      return '<span class="t-n">' + num + '</span>';
    });
  }

  // ── showing what was pasted, neatly ──
  function pasteView(p) {
    var body = '';
    if (p.kind === 'table') {
      var rows = asTable(p.text, p.delim || looksTable(p.text) || ',');
      var head = rows[0] || [];
      body = '<div class="tbl"><table><thead><tr>' + head.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.slice(1, 200).map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';

    var long = p.text.split('\n').length > 11 || p.text.length > 900;
    var look = KIND_LOOK[p.kind] || KIND_LOOK.text;
    var el = document.createElement('div');
    el.className = 'paste';
    el.innerHTML = '<header><span class="att-k" style="color:' + look[1] + ';font:700 .72rem var(--mono)">' + esc(look[0]) + '</span><b>' + esc(p.name || describe(p).split(' · ')[0]) + '</b><span>' + esc(describe(p).split(' · ')[1] || '') + '</span><span class="sp"></span><button type="button" data-copy>Copy</button>' + (long ? '<button type="button" data-open>Show all</button>' : '') + '</header><div class="view' + (long ? ' long' : '') + '">' + body + '</div>';
    el.querySelector('[data-copy]').onclick = function () { var b = this; navigator.clipboard.writeText(p.text).then(function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy'; }, 1300); }); };

  // ── the box: typing, pasting, files ──
  var q = $('q');
  function grow() { q.style.height = 'auto'; q.style.height = Math.min(220, q.scrollHeight) + 'px'; }

  function drawAtts() {
    var box = $('atts');

    box.innerHTML = '';

      var el = document.createElement('div');
      el.className = 'att';
      el.innerHTML = '<span class="k" style="background:' + look[1] + '">' + esc(look[0]) + '</span><span><b>' + esc(p.name || describe(p)) + '</b><small>' + esc((p.name ? describe(p) + ' · ' : '') + p.text.trim().split('\n')[0].slice(0, 80)) + '</small></span><button type="button" aria-label="Remove">' + icon(I.x) + '</button>';

  function inline(s, sources) {

      return '<a class="cite" style="background:' + hueOf(src.domain) + '" href="' + esc(src.url) + '" target="_blank" rel="noopener noreferrer" title="' + esc(src.title + ' · ' + src.domain) + '">' + n + '</a>';

      var l = lines[i];
      var fence = /^\s*```\s*([\w+#.-]*)/.exec(l);
      if (fence) {

        var lang = (fence[1] || '').toLowerCase(), code = []; i++;

        out.push('<div class="codeblock"><header><span>' + esc(lang || 'text') + '</span><button type="button" data-code>Copy</button></header><pre><code>' + (lang === 'json' ? highlightJson(c) : highlight(c, LANG_EXT[lang] || lang)) + '</code></pre></div>');
        i++; continue;

      wireSetup($('addAI'), function () { $('settings').close(); });
      $('braveSave').onclick = function () { api('brave', { key: $('braveKey').value }).then(function (x) { S = x; $('braveMsg').className = 'msg ok'; $('braveMsg').textContent = x.brave ? 'Saved.' : 'Removed.'; }); };
      $('forget').onclick = function () { api('forget', {}).then(function (x) { S = x; $('forget').textContent = 'Deleted'; newChat(); }); };
      $('closeSet').onclick = function () { $('settings').close(); };
      $('settings').showModal();
    });
  }
  $('gearBtn').onclick = openSettings;

  setBusy(null);
  refresh();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scout</title>
<link rel="icon" id="icon" href="data:,">
<style>
/* scout: a quiet reading room. White paper, ink-blue links, and Pip's amber;
   each website gets its own colour so sources are easy to tell apart. */
:root {
  --paper: #ffffff; --wash: #f4f5f7; --ink: #1d2330; --dim: #5f6776; --faint: #9aa1ad; --line: #e3e6eb;
  --amber: #d98e1f; --amber-soft: #fdf3e2; --blue: #2b5fa8; --mint: #1f9d7a; --rose: #cf3f5c;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "New York", "Iowan Old Style", Charter, Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
:root[data-theme=dark] {
  --paper: #15171c; --wash: #1d2027; --ink: #e9ebef; --dim: #a3a9b5; --faint: #6c7280; --line: #2b2f38;
  --amber: #f0ad45; --amber-soft: rgba(240, 173, 69, .12); --blue: #8ab4f0; --mint: #4fd1a5; --rose: #ff7a90;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
[hidden] { display: none !important; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
canvas.pip { image-rendering: pixelated; }

.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 10px 18px; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); }
.brand { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 6px; border-radius: 8px; font-weight: 700; font-size: 1.05rem; }
.brand canvas { width: 26px; height: 24px; }
.brand:hover { background: var(--wash); }
.spacer { flex: 1; }
.icon { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 9px; background: none; color: var(--dim); }
.icon:hover { background: var(--wash); color: var(--ink); }
.newq { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: .9rem; }
.newq:hover { background: var(--wash); }

/* ── home ── */
.home { min-height: calc(100vh - 60px); display: grid; place-items: center; padding: 20px 18px 80px; }
.home .inner { width: min(680px, 100%); text-align: center; }
.home canvas.pip { width: 72px; height: 68px; margin-bottom: 6px; }
.home h1 { font: 600 2.1rem/1.2 var(--serif); margin: 0 0 22px; letter-spacing: -.01em; }
.ask { display: flex; align-items: flex-end; gap: 8px; padding: 10px 10px 10px 18px; border: 1.5px solid var(--line); border-radius: 22px; background: var(--paper); box-shadow: 0 6px 24px -14px rgba(20, 30, 50, .35); text-align: left; }
.ask:focus-within { border-color: var(--amber); box-shadow: 0 0 0 4px var(--amber-soft), 0 6px 24px -14px rgba(20, 30, 50, .35); }
.ask textarea { flex: 1; border: 0; outline: none; resize: none; background: none; font-size: 1.1rem; line-height: 1.5; padding: 6px 0; max-height: 200px; min-height: 30px; }
.go { width: 42px; height: 42px; border-radius: 14px; border: 0; background: var(--ink); color: var(--paper); display: grid; place-items: center; flex: none; }
.go:disabled { opacity: .3; cursor: default; }
.go:not(:disabled):hover { background: var(--amber); color: #fff; }
.hint { color: var(--faint); font-size: .85rem; margin-top: 10px; }
.tries { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 14px; color: var(--dim); font-size: .92rem; }
.chip:hover { color: var(--ink); border-color: var(--faint); }
.recent { margin-top: 34px; text-align: left; }
.recent h2 { font-size: .85rem; color: var(--faint); font-weight: 600; margin: 0 0 6px 4px; }
.recent button { display: flex; width: 100%; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 10px; color: var(--dim); }
.recent button:hover { background: var(--wash); color: var(--ink); }
.recent button span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent small { color: var(--faint); }

/* ── answers ── */
.thread { width: min(760px, 100%); margin: 0 auto; padding: 8px 20px 170px; }
.turn { padding: 18px 0 30px; border-bottom: 1px solid var(--line); }
.turn:last-child { border-bottom: 0; }
.turn h1 { font: 600 1.75rem/1.25 var(--serif); margin: 6px 0 14px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.status { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: .92rem; margin: 6px 0 14px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; background: var(--amber); animation: blink 1.1s infinite; }
.dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.sources { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px 6px; scrollbar-width: thin; }
.src { flex: 0 0 196px; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); text-decoration: none; color: var(--ink); min-height: 92px; }
.src:hover { border-color: var(--faint); background: var(--wash); }
.src .who { display: flex; align-items: center; gap: 7px; color: var(--dim); font-size: .8rem; min-width: 0; }
.src .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fav { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; color: #fff; font: 700 .7rem var(--sans); flex: none; }
.src b { font-weight: 500; font-size: .88rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.src .num { margin-left: auto; color: var(--faint); font-size: .75rem; }
.answer { font-size: 1.05rem; line-height: 1.7; overflow-wrap: anywhere; }
.answer p { margin: 0 0 .9em; }
.answer p:first-child strong { font-weight: 650; }
.answer h2, .answer h3 { font: 650 1.12rem/1.35 var(--sans); margin: 1.3em 0 .5em; }
.answer ul, .answer ol { margin: 0 0 1em; padding-left: 1.3em; }
.answer li { margin: .3em 0; }
.answer li::marker { color: var(--amber); }
.answer code { font: .9em var(--mono); background: var(--wash); padding: .1em .35em; border-radius: 5px; }
.answer pre { background: var(--wash); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; overflow: auto; font: .88rem/1.5 var(--mono); }
.answer pre code { background: none; padding: 0; }
.answer table { border-collapse: collapse; width: 100%; margin: .4em 0 1.1em; font-size: .95rem; }
.answer th, .answer td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.answer th { font-weight: 650; color: var(--dim); font-size: .85rem; }
.cite { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; margin: 0 1px; border-radius: 6px; font: 600 .72rem var(--sans); color: #fff; text-decoration: none; vertical-align: 2px; }
.cite:hover { filter: brightness(1.1); }
.caret::after { content: ""; display: inline-block; width: 8px; height: 1.1em; vertical-align: -2px; background: var(--amber); margin-left: 2px; animation: blink 1s infinite; }
.after { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; }
.after .by { color: var(--faint); font-size: .82rem; margin-left: auto; }
.small-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-size: .85rem; color: var(--dim); }
.small-btn:hover { color: var(--ink); background: var(--wash); }
.more { margin-top: 20px; }
.more h3 { font-size: .85rem; color: var(--faint); font-weight: 600; margin: 0 0 8px; }
.more button { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 11px 4px; color: var(--ink); }
.more button:hover { color: var(--amber); }
.more button svg { color: var(--faint); margin-left: auto; }
.oops { border: 1px solid color-mix(in srgb, var(--rose) 40%, var(--line)); background: color-mix(in srgb, var(--rose) 6%, var(--paper)); border-radius: 14px; padding: 12px 16px; color: var(--ink); }
.setup { border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; background: var(--wash); margin-top: 8px; }
.setup h2 { margin: 0 0 4px; font-size: 1.15rem; }
.setup p { margin: 0 0 12px; color: var(--dim); }
.pick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.pick button { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 7px 14px; font-weight: 600; color: var(--dim); }
.pick button[aria-pressed=true] { border-color: var(--amber); color: var(--ink); box-shadow: 0 0 0 3px var(--amber-soft); }
.steps { margin: 0 0 12px; padding-left: 1.3em; color: var(--dim); }
.steps li { margin: 4px 0; }
.keyrow { display: flex; gap: 8px; }
.keyrow input { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); font-family: var(--mono); font-size: .9rem; }
.keyrow input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 650; background: var(--ink); color: var(--paper); white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--amber); color: #fff; }
.btn.light { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
.msg { min-height: 1.4em; margin-top: 8px; font-size: .9rem; color: var(--dim); }
.msg.err { color: var(--rose); }
.msg.ok { color: var(--mint); }

/* the follow-up box, stuck to the bottom */
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 18px 18px; background: linear-gradient(transparent, var(--paper) 30%); }
.dock .ask { width: min(760px, 100%); margin: 0 auto; }
.dock .ask textarea { font-size: 1rem; }

/* settings */
dialog { border: 0; padding: 0; background: none; color: inherit; max-width: calc(100vw - 24px); }
dialog::backdrop { background: rgba(10, 14, 22, .45); }
.sheet { width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 22px 24px; }
.sheet h2 { margin: 0 0 4px; font-size: 1.25rem; }
.sheet section { padding: 14px 0; border-top: 1px solid var(--line); }
.sheet section:first-of-type { border-top: 0; }
.sheet h3 { margin: 0 0 6px; font-size: 1rem; }
.sheet p { margin: 0 0 10px; color: var(--dim); font-size: .92rem; }
.sheet select { width: 100%; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); }
.sheet .end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
@media (max-width: 600px) {
  .home h1 { font-size: 1.7rem; }
  .turn h1 { font-size: 1.45rem; }
  .src { flex-basis: 160px; }
  .keyrow { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="brand" title="Start over"><canvas class="pip" width="16" height="15" aria-hidden="true"></canvas>scout</button>
  <span class="spacer"></span>
  <button class="newq" id="newBtn" hidden><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New question</button>
  <button class="icon" id="themeBtn" title="Light or dark" aria-label="Light or dark"></button>
  <button class="icon" id="gearBtn" title="Settings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<section class="home" id="home">
  <div class="inner">
    <canvas class="pip" width="16" height="15" aria-hidden="true"></canvas>
    <h1>What do you want to know?</h1>
    <form class="ask" id="askHome"><textarea id="qHome" rows="1" placeholder="Ask anything…" aria-label="Your question" autofocus></textarea><button class="go" type="submit" aria-label="Ask" disabled><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
    <div class="hint">Press Enter to ask. scout searches the web, reads the best pages and explains what it found.</div>
    <div class="tries" id="tries"></div>
    <div class="recent" id="recent" hidden><h2>Asked before</h2><div id="recentList"></div></div>
  </div>
</section>

<main class="thread" id="thread" hidden></main>
<div class="dock" id="dock" hidden><form class="ask" id="askMore"><textarea id="qMore" rows="1" placeholder="Ask a follow-up…" aria-label="Ask a follow-up"></textarea><button class="go" type="submit" aria-label="Ask" disabled><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form></div>

<dialog id="settings"><div class="sheet" id="sheet"></div></dialog>

<script>
(function () {
  'use strict';
  var CONF = /*SCOUT*/{};
  var BASE = CONF.base || './';
  var $ = function (id) { return document.getElementById(id); };
  var S = null; // the server's state: models, free AIs, recent questions
  var turns = []; // this conversation: [{ q, a }]
  var busy = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function api(path, body) {
    return fetch(BASE + 'api/' + path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {})
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong.'); return j; }); });
  }

  // ── Pip the owl, in pixels ──
  var PIP = ['..D..........D..', '..DD........DD..', '..DBBBBBBBBBBD..', '.DBWWWWBBWWWWBD.', '.DWYYYWBBWYYYWD.', '.DWYKYWBBWYKYWD.', '.DWYYYWOOWYYYWD.', '.DBWWWBOOBWWWBD.', '.DBBCCCCCCCCBBD.', 'DBBCBCCBCCBCCBBD', 'DBBCCCCCCCCCCBBD', 'DBBCCBCCBCCBCBBD', '.DBBCCCCCCCCBBD.', '..DBBBBBBBBBBD..', '...FF......FF...'];
  var BLINK = PIP.map(function (r, y) { return y === 5 ? r.replace(/YKY/g, 'BBB') : y === 4 || y === 6 ? r.replace(/YYY/g, 'BBB') : r; });
  var INK = { D: '#4a2f1f', B: '#8a5a3c', W: '#f3e6cc', Y: '#f2b632', K: '#1b1410', O: '#e8792b', C: '#e2c391', F: '#e8792b' };
  function drawPip(cv, grid) { var g = cv.getContext('2d'); g.clearRect(0, 0, 16, 15); grid.forEach(function (row, y) { row.split('').forEach(function (c, x) { if (INK[c]) { g.fillStyle = INK[c]; g.fillRect(x, y, 1, 1); } }); }); }
  function pips(grid) { document.querySelectorAll('canvas.pip').forEach(function (cv) { drawPip(cv, grid || PIP); }); }
  pips();
  (function () { var cv = document.createElement('canvas'); cv.width = 16; cv.height = 15; drawPip(cv, PIP); try { $('icon').href = cv.toDataURL(); } catch (e) { /* fine */ } })();
  setInterval(function () { pips(BLINK); setTimeout(function () { pips(PIP); }, 160); }, 5200); // an owl blinks now and then

  // ── light or dark ──
  var theme = (function () { try { return localStorage.getItem('scout-theme') || 'auto'; } catch (e) { return 'auto'; } })();
  var SUN = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  var MOON = '<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  function paintTheme() {
    var dark = theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('themeBtn').innerHTML = dark ? SUN : MOON;
  }
  paintTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme);
  $('themeBtn').onclick = function () { theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('scout-theme', theme); } catch (e) { /* fine */ } paintTheme(); };

  // ── each website gets its own colour ──
  var HUES = ['#2b5fa8', '#1f9d7a', '#c2571a', '#7b4fd6', '#cf3f5c', '#0e8aa8', '#8a6d1c', '#5a6b2a'];
  function hueOf(domain) { var h = 0; for (var i = 0; i < domain.length; i++) h = (h * 31 + domain.charCodeAt(i)) >>> 0; return HUES[h % HUES.length]; }

  // ── a little markdown ──
  function inline(s, sources) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,!?:;]|$)/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, function (m, t, u) { return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + t + '</a>'; });
    s = s.replace(/\[(\d{1,2})\]/g, function (m, n) {
      var src = (sources || []).filter(function (x) { return x.n === Number(n); })[0];
      if (!src) return '';
      return '<a class="cite" style="background:' + hueOf(src.domain) + '" href="' + esc(src.url) + '" target="_blank" rel="noopener noreferrer" title="' + esc(src.title + ' · ' + src.domain) + '">' + n + '</a>';
    });
    return s;
  }
  function markdown(md, sources) {
    var out = [], lines = String(md || '').split('\n'), i = 0, list = null, para = [];
    function endPara() { if (para.length) { out.push('<p>' + inline(para.join(' '), sources) + '</p>'); para = []; } }
    function endList() { if (list) { out.push('</' + list + '>'); list = null; } }
    while (i < lines.length) {
      var l = lines[i];
      if (/^```/.test(l)) { endPara(); endList(); var code = []; i++; while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]); out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); i++; continue; }
      if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        endPara(); endList();
        var row = function (r) { return r.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); };
        var head = row(l); i += 2; var body = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) body.push(row(lines[i++]));
        out.push('<table><thead><tr>' + head.map(function (c) { return '<th>' + inline(c, sources) + '</th>'; }).join('') + '</tr></thead><tbody>' + body.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inline(c, sources) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
        continue;
      }
      var h = /^#{1,4}\s+(.*)$/.exec(l), b = /^\s*[-*•]\s+(.*)$/.exec(l), n = /^\s*\d+[.)]\s+(.*)$/.exec(l);
      if (h) { endPara(); endList(); out.push('<h2>' + inline(h[1], sources) + '</h2>'); }
      else if (b || n) { endPara(); var want = b ? 'ul' : 'ol'; if (list !== want) { endList(); out.push('<' + want + '>'); list = want; } out.push('<li>' + inline((b || n)[1], sources) + '</li>'); }
      else if (!l.trim()) { endPara(); endList(); }
      else { endList(); para.push(l.trim()); }
      i++;
    }
    endPara(); endList();
    return out.join('');
  }

  // ── the question boxes ──
  function grow(t) { t.style.height = 'auto'; t.style.height = Math.min(200, t.scrollHeight) + 'px'; }
  function wire(form, ta) {
    var go = form.querySelector('.go');
    ta.addEventListener('input', function () { grow(ta); go.disabled = !ta.value.trim(); });
    ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
    form.addEventListener('submit', function (e) { e.preventDefault(); var q = ta.value.trim(); if (!q || busy) return; ta.value = ''; grow(ta); go.disabled = true; ask(q); });
  }
  wire($('askHome'), $('qHome'));
  wire($('askMore'), $('qMore'));
  var TRIES = ['How do noise-cancelling headphones work?', 'Best free video editor for a Mac', 'Why is the sky blue?', 'How long do cats live?', 'What is a credit score, simply?'];
  $('tries').innerHTML = TRIES.map(function (t) { return '<button class="chip" type="button">' + esc(t) + '</button>'; }).join('');
  $('tries').querySelectorAll('button').forEach(function (b) { b.onclick = function () { ask(b.textContent); }; });

  function goHome() {
    if (busy) busy.abort();
    turns = [];
    $('thread').innerHTML = '';
    $('thread').hidden = true; $('dock').hidden = true; $('newBtn').hidden = true;
    $('home').hidden = false;
    refresh();
    setTimeout(function () { $('qHome').focus(); }, 0);
  }
  $('brand').onclick = goHome;
  $('newBtn').onclick = goHome;

  function showThread() { $('home').hidden = true; $('thread').hidden = false; $('dock').hidden = false; $('newBtn').hidden = false; }

  function ago(t) { var s = (Date.now() - t) / 1000; if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' min ago'; if (s < 86400) return Math.round(s / 3600) + ' h ago'; return Math.round(s / 86400) + ' d ago'; }
  function refresh() {
    return api('state').then(function (s) {
      S = s;
      var r = s.recent || [];
      $('recent').hidden = !r.length;
      $('recentList').innerHTML = r.slice(0, 6).map(function (x) { return '<button type="button" data-id="' + esc(x.id) + '"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>' + esc(x.q) + '</span><small>' + ago(x.at) + '</small></button>'; }).join('');
      $('recentList').querySelectorAll('button').forEach(function (b) { b.onclick = function () { openPast(b.dataset.id); }; });
      return s;
    });
  }

  // ── one question → one turn on the page ──
  function sourceCards(sources) {
    return sources.map(function (s) {
      var c = hueOf(s.domain);
      return '<a class="src" href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer"><span class="who"><span class="fav" style="background:' + c + '">' + esc((s.site || s.domain || '?').charAt(0).toUpperCase()) + '</span><span>' + esc(s.site || s.domain) + '</span><span class="num">' + s.n + '</span></span><b>' + esc(s.title) + '</b></a>';
    }).join('');
  }
  var ARROW = '<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  function moreBlock(list) {
    if (!list || !list.length) return '';
    return '<div class="more"><h3>People also want to know</h3>' + list.map(function (f) { return '<button type="button">' + esc(f) + ARROW + '</button>'; }).join('') + '</div>';
  }
  function wireMore(el) { el.querySelectorAll('.more button').forEach(function (b) { b.onclick = function () { ask(b.textContent); }; }); }

  function newTurn(q) {
    showThread();
    var el = document.createElement('article');
    el.className = 'turn';
    el.innerHTML = '<h1>' + esc(q) + '</h1><div class="status"><span class="dots"><i></i><i></i><i></i></span><span class="st">Searching the web…</span></div><div class="sources" hidden></div><div class="answer"></div><div class="tail"></div>';
    $('thread').appendChild(el);
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return el;
  }

  function ask(q) {
    var el = newTurn(q);
    var st = el.querySelector('.st'), srcEl = el.querySelector('.sources'), ans = el.querySelector('.answer'), tail = el.querySelector('.tail');
    var sources = [], text = '', drawn = 0;
    var draw = function () { if (drawn) return; drawn = requestAnimationFrame(function () { drawn = 0; ans.innerHTML = markdown(text, sources); ans.classList.add('caret'); }); };
    var ac = new AbortController();
    busy = ac;
    var history = turns.slice(-2);
    fetch(BASE + 'api/ask', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ q: q, history: history }), signal: ac.signal })
      .then(function (r) {
        var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
        function pump() {
          return reader.read().then(function (x) {
            if (x.done) return;
            buf += dec.decode(x.value, { stream: true });
            var k;
            while ((k = buf.indexOf('\n\n')) >= 0) {
              var block = buf.slice(0, k); buf = buf.slice(k + 2);
              var type = (/^event: (.*)$/m.exec(block) || [])[1], data = (/^data: (.*)$/m.exec(block) || [])[1];
              if (type && data) on(type, JSON.parse(data));
            }
            return pump();
          });
        }
        return pump();
      })
      .catch(function (e) { if (e.name !== 'AbortError') on('error', { message: "scout stopped answering. Is the Terminal window still open?" }); })
      .then(function () { if (busy === ac) busy = null; ans.classList.remove('caret'); });

    function on(type, d) {
      if (type === 'step') st.textContent = d.step === 'search' ? 'Searching the web…' : d.step === 'read' ? 'Reading ' + d.count + ' websites…' : d.step === 'write' ? 'Writing the answer…' : st.textContent;
      else if (type === 'sources') { sources = d; if (d.length) { srcEl.innerHTML = sourceCards(d); srcEl.hidden = false; } }
      else if (type === 'text') { text += d; el.querySelector('.status').hidden = true; draw(); }
      else if (type === 'done') {
        cancelAnimationFrame(drawn); drawn = 0;
        ans.innerHTML = markdown(text, sources); ans.classList.remove('caret');
        el.querySelector('.status').hidden = true;
        turns.push({ q: q, a: text });
        tail.innerHTML = '<div class="after"><button class="small-btn" type="button" data-copy>Copy answer</button>' + (d.model ? '<span class="by">answered by ' + esc(d.model) + '</span>' : '') + '</div>' + moreBlock(d.followups);
        tail.querySelector('[data-copy]').onclick = function () { var b = this; navigator.clipboard.writeText(text.replace(/\[(\d+)\]/g, '')).then(function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy answer'; }, 1400); }); };
        wireMore(tail);
        $('qMore').focus();
      } else if (type === 'noai') {
        el.querySelector('.status').hidden = true;
        sources = d.sources || [];
        if (sources.length) { srcEl.innerHTML = sourceCards(sources); srcEl.hidden = false; }
        ans.innerHTML = '';
        tail.innerHTML = setupCard(true);
        wireSetup(tail, function () { el.remove(); ask(q); });
      } else if (type === 'error') {
        el.querySelector('.status').hidden = true;
        tail.innerHTML = '<div class="oops">' + esc(d.message) + '</div>';
      }
    }
  }

  function openPast(id) {
    api('past/' + encodeURIComponent(id)).then(function (h) {
      turns = [{ q: h.q, a: h.a }];
      $('thread').innerHTML = '';
      var el = newTurn(h.q);
      el.querySelector('.status').hidden = true;
      if (h.sources && h.sources.length) { el.querySelector('.sources').innerHTML = sourceCards(h.sources); el.querySelector('.sources').hidden = false; }
      el.querySelector('.answer').innerHTML = markdown(h.a, h.sources || []);
      el.querySelector('.tail').innerHTML = '<div class="after"><span class="by">asked ' + ago(h.at) + (h.model ? ' · answered by ' + esc(h.model) : '') + '</span></div>' + moreBlock(h.followups);
      wireMore(el);
    }).catch(function (e) { alert(e.message); });
  }

  // ── setting up free AI: pick one, get a key, paste it ──
  function setupCard(first) {
    var f = (S && S.free) || [];
    return '<div class="setup"><h2>' + (first ? 'One more step: set up free AI' : 'Add a free AI') + '</h2><p>' + (first ? 'scout found the websites above. To read them and explain the answer, it needs an AI. It\'s free and takes about a minute.' : 'Add another free AI. If one is busy, scout uses the next.') + '</p>' +
      '<div class="pick">' + f.map(function (x, i) { return '<button type="button" data-p="' + esc(x.id) + '" aria-pressed="' + (i === 0) + '">' + esc(x.name) + '</button>'; }).join('') + '</div>' +
      '<ol class="steps"><li><a class="go-key" href="' + esc(f[0] ? f[0].url : '#') + '" target="_blank" rel="noopener noreferrer">Open the free key page</a> <span class="howto">' + esc(f[0] ? f[0].steps : '') + '</span></li><li>Paste the key here, then click Save.</li></ol>' +
      '<div class="keyrow"><input type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key here"><button class="btn" type="button" data-save>Save</button></div><div class="msg" role="status"></div></div>';
  }
  function wireSetup(root, done) {
    var f = (S && S.free) || [], pick = f[0] ? f[0].id : 'groq';
    root.querySelectorAll('[data-p]').forEach(function (b) {
      b.onclick = function () {
        pick = b.dataset.p;
        root.querySelectorAll('[data-p]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        var x = f.filter(function (y) { return y.id === pick; })[0];
        root.querySelector('.go-key').href = x.url; root.querySelector('.howto').textContent = x.steps;
      };
    });
    var input = root.querySelector('.keyrow input'), msg = root.querySelector('.msg');
    root.querySelector('[data-save]').onclick = function () {
      msg.className = 'msg'; msg.textContent = 'Checking the key…';
      api('key', { provider: pick, key: input.value }).then(function (s) { S = s; msg.className = 'msg ok'; msg.textContent = 'Saved. ' + (s.model ? s.model.name + ' will answer.' : ''); setTimeout(done, 500); })
        .catch(function (e) { msg.className = 'msg err'; msg.textContent = e.message; });
    };
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') root.querySelector('[data-save]').click(); });
  }

  // ── settings ──
  $('gearBtn').onclick = function () {
    refresh().then(function (s) {
      var opts = s.models.map(function (m) { return '<option value="' + esc(m.key) + '"' + (s.model && s.model.key === m.key ? ' selected' : '') + '>' + esc(m.name) + (m.local ? ' (on this computer)' : m.free ? ' (free)' : '') + '</option>'; }).join('');
      $('sheet').innerHTML = '<h2>Settings</h2><section><h3>Who answers</h3>' + (s.models.length ? '<p>The AI that reads the websites and writes the answer.</p><select id="modelSel"><option value="">Pick for me (the quickest free one)</option>' + opts + '</select>' : '<p>No AI yet. Add a free one below.</p>') + '</section>' +
        '<section id="addAI">' + setupCard(false) + '</section>' +
        '<section><h3>Better search (optional)</h3><p>scout searches with DuckDuckGo and Wikipedia, no key needed. A free Brave Search key makes results steadier. Get one at <a href="https://brave.com/search/api/" target="_blank" rel="noopener noreferrer">brave.com/search/api</a>.</p><div class="keyrow"><input id="braveKey" type="password" autocomplete="off" placeholder="' + (s.brave ? 'A Brave key is saved' : 'Paste a Brave Search key') + '"><button class="btn light" type="button" id="braveSave">Save</button></div><div class="msg" id="braveMsg"></div></section>' +
        '<section><h3>Your past questions</h3><p>They\'re kept on this computer only.</p><button class="btn light" type="button" id="forget">Clear them</button></section>' +
        '<div class="end"><button class="btn" type="button" id="closeSet">Done</button></div>';
      if ($('modelSel')) $('modelSel').onchange = function () { api('model', { model: this.value }).then(function (x) { S = x; }); };
      wireSetup($('addAI'), function () { $('settings').close(); });
      $('braveSave').onclick = function () { api('brave', { key: $('braveKey').value }).then(function (x) { S = x; $('braveMsg').className = 'msg ok'; $('braveMsg').textContent = x.brave ? 'Saved.' : 'Removed.'; }); };
      $('forget').onclick = function () { api('forget', {}).then(function () { $('forget').textContent = 'Cleared'; refresh(); }); };
      $('closeSet').onclick = function () { $('settings').close(); };
      $('settings').showModal();
    });
  };

  refresh();
})();
</script>
</body>
</html>
